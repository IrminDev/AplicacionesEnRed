services:
  server:
    build: ./server
    environment:
      - FILE_PATH=file.iso  # Custom file path
      - CHUNK_SIZE_KB=2048             # 2MB chunks
      - HTTP_PORT=8000                  # Default HTTP port
      - TORRENT_NAME=distribute.torrent
    ports:
      - "6881:6881"
      - "6881:6881/udp"
      - "8000:8000"                     # HTTP port

  client:
    build: ./client
    environment:
      - SERVER_URL=http://server:8000/distribute.torrent
    depends_on:
      - server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/distribute.torrent"]
      interval: 5s
      timeout: 10s
      retries: 5

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.tx_queue_len: "1000"
